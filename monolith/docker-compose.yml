version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: golang-wallet-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: golwallet
      MYSQL_USER: golwallet_user
      MYSQL_PASSWORD: golwallet_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  redis1:
    image: redis:7-alpine
    container_name: golwallet-redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  mysql_data:
  